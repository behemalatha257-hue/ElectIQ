# ============================================================
# ElectIQ — Cloud Build CI/CD Pipeline
# Triggers on push to main branch → builds → deploys to Cloud Run
# ============================================================
steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    args:
      - 'build'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/electiq/electiq-app:$COMMIT_SHA'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/electiq/electiq-app:latest'
      - '--cache-from'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/electiq/electiq-app:latest'
      - '.'

  # Step 2: Push image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    args:
      - 'push'
      - '--all-tags'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/electiq/electiq-app'

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-cloud-run'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'electiq-app'
      - '--image=$_REGION-docker.pkg.dev/$PROJECT_ID/electiq/electiq-app:$COMMIT_SHA'
      - '--region=$_REGION'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=3000'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--concurrency=80'
      - '--timeout=60'
      - '--set-env-vars=NODE_ENV=production,NEXT_TELEMETRY_DISABLED=1'
      - '--set-secrets=GEMINI_API_KEY=gemini-api-key:latest'

# Push final images to registry
images:
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/electiq/electiq-app:$COMMIT_SHA'
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/electiq/electiq-app:latest'

# Substitution variables (override in Cloud Build trigger)
substitutions:
  _REGION: 'us-central1'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: '1200s'
